# Desenvolvimento:  docker compose up -d db
# Produção (VPS):   docker compose --profile production up -d --build
# Comandos avulsos: docker compose run --rm tools npm run admin:create -- --name "..." --email ... --password ...

x-database-url: &database-url postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      # Exposto só na própria máquina (para rodar o app com npm run dev). Nunca abra para a internet.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Aplica as migrations pendentes e encerra. O app só sobe depois que ele termina com sucesso.
  migrate:
    build:
      context: .
      target: tools
    env_file: .env
    environment:
      DATABASE_URL: *database-url
    command: ["npm", "run", "db:migrate"]
    depends_on:
      db:
        condition: service_healthy
    profiles: ["production", "tools"]

  app:
    build:
      context: .
      target: runner
      args:
        TENANT: ${TENANT:-demo}
        S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: *database-url
      STORAGE_LOCAL_DIR: /app/storage
    volumes:
      - media-storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    profiles: ["production"]

  # HTTPS automático (Let's Encrypt) para o domínio definido em DOMAIN.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    profiles: ["production"]

  # Container para comandos avulsos (criar gerente, seed, limpeza de fotos).
  tools:
    build:
      context: .
      target: tools
    env_file: .env
    environment:
      DATABASE_URL: *database-url
      STORAGE_LOCAL_DIR: /app/storage
    volumes:
      - media-storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
    profiles: ["tools"]

volumes:
  postgres-data:
  media-storage:
  caddy-data:
  caddy-config:
